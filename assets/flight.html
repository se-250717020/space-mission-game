<!doctype html>
<html>
<head>
<meta charset="utf-8">
<!--
  flight.html — Gerçekçi fırlatma animasyonu + uzay aracı uçurma mini oyunu (saf Vanilla JS, kütüphane yok).
  app.py bu dosyayı okur, __CONFIG__ yerine JSON ayarlarını koyar ve iframe içinde gömer.
  Akış: geri sayım (sesli) → ateşleme (duman, sarsıntı, motor gürültüsü) → kalkış (kamera roketi izler,
  gökyüzü kararır, kademe ayrılır) → Dünya'dan hedefe yolculuk → yörüngeye giriş → (başarılıysa) mini oyun.
  Roket ve uzay aracı resimleri artwork.py'den SVG olarak gelir (atölyede ne tasarlandıysa o uçar).
  Hata nerede olduysa animasyon orada biter: fırlatma öncesi → "LAUNCH SCRUBBED", fırlatma → patlama,
  yolculuk → sinyal kaybı, yörünge → görev kaybı. Animasyon bitince sağdaki raporu JS açar (revealReport).
  Sesler dosya değil: Web Audio API ile üretilir; geri sayımı tarayıcının konuşma sesi (speechSynthesis) okur.
  Ekrandaki tüm yazılar İngilizce (sözleşme), yorumlar Türkçe.
-->
<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@700;900&family=Nunito:wght@700;800&family=Share+Tech+Mono&display=swap" rel="stylesheet">
<style>
  html, body { margin: 0; padding: 0; height: 100%; background: transparent; overflow: hidden; }
  #wrap { position: relative; height: 100%; border-radius: 16px; overflow: hidden; border: 1px solid rgba(110,150,255,.28);
          background: #03060d; box-shadow: 0 10px 34px rgba(0,0,0,.5); }
  canvas { display: block; width: 100%; height: 100%; touch-action: none; outline: none; cursor: crosshair; }
  .btn { position: absolute; bottom: 10px; z-index: 2; border: 1px solid rgba(110,150,255,.35); background: rgba(5,8,18,.8);
         color: #e8ecf4; border-radius: 10px; font: 800 14px Nunito, sans-serif; padding: 5px 10px; cursor: pointer; }
  .btn:hover { border-color: rgba(79,209,255,.8); }
  #mute { right: 10px; font-size: 16px; padding: 4px 8px; }
  #skip { left: 10px; }
</style>
</head>
<body>
<div id="wrap"><canvas id="c" tabindex="0"></canvas><button id="skip" class="btn" title="Skip the animation">⏩ Skip</button><button id="mute" class="btn" title="Sound on / off">🔊</button></div>
<script>
const CFG = __CONFIG__;
const G = CFG.game;
const TAU = Math.PI * 2;
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
const lerp = (a, b, t) => a + (b - a) * t;
const ease = (t) => (t < 0.5 ? 2 * t * t : 1 - Math.pow(-2 * t + 2, 2) / 2);
const rand = (a, b) => a + Math.random() * (b - a);

// ================================================================ SES (Web Audio, dosyasız)
let actx = null, master = null, muted = !CFG.sound, trim = 1;
const VOL = clamp(CFG.volume / 100, 0, 1);
const dbToGain = (db) => Math.pow(10, db / 20);
// SES SEVİYELERİ: her efekt çevrimdışı çalınıp algılanan yüksekliği ölçüldü (K-ağırlıklı, 200 ms, LUFS benzeri).
// Eskiden en sessiz ile en yüksek arasında ~38 dB fark vardı; bu tablo hepsini aynı hedefe (-22 LUFS) getirir.
// AYNI TABLO frontend/src/sound.js içinde de var.
const TRIM_DB = { pip: 13.6, siren: 12.6, ignite: -12.1, sep: 2.3, boom: -16.2, whoosh: 5.8, burn: 14.3, chime: 15.3,
                  glitch: 6.0, win: 4.1, collect: 9.7, sent: 19.0, energy: 8.3, hit: 3.2, full: 12.9, over: 5.2 };
const ENGINE_TRIM = dbToGain(-13.8), SPEECH_LEVEL = 0.8;
const muteBtn = document.getElementById('mute');
const skipBtn = document.getElementById('skip');
muteBtn.textContent = muted ? '🔇' : '🔊';
function audio() {
  if (muted) return null;
  try {
    if (!actx) {
      // Üst sayfanın AudioContext'i: kullanıcı LAUNCH'a bastığı için ses izni orada var
      let AC = null;
      try { AC = window.parent.AudioContext || window.parent.webkitAudioContext; } catch (e) { AC = null; }
      AC = AC || window.AudioContext || window.webkitAudioContext;
      actx = new AC();
      master = actx.createGain();
      master.gain.value = VOL;
      // Sınırlayıcı: aynı anda çalan sesler toplanınca cızırtı olmasın
      const limiter = actx.createDynamicsCompressor();
      limiter.threshold.value = -3; limiter.knee.value = 0; limiter.ratio.value = 20;
      limiter.attack.value = 0.002; limiter.release.value = 0.15;
      master.connect(limiter); limiter.connect(actx.destination);
    }
    if (actx.state === 'suspended') actx.resume();
    return actx;
  } catch (e) { return null; }
}
function tone(f, d, type, v, f2, at) {
  const a = audio(); if (!a) return;
  const t = a.currentTime + (at || 0);
  const o = a.createOscillator(), g = a.createGain();
  o.type = type || 'sine';
  o.frequency.setValueAtTime(f, t);
  if (f2) o.frequency.exponentialRampToValueAtTime(f2, t + d);
  g.gain.setValueAtTime(0.0001, t);
  g.gain.exponentialRampToValueAtTime((v || 0.2) * trim, t + 0.012);
  g.gain.exponentialRampToValueAtTime(0.0001, t + d);
  o.connect(g); g.connect(master); o.start(t); o.stop(t + d + 0.05);
}
function noiseBuffer(a, secs, brown) {
  const len = Math.floor(a.sampleRate * secs), buf = a.createBuffer(1, len, a.sampleRate), ch = buf.getChannelData(0);
  let last = 0;
  for (let i = 0; i < len; i++) {
    const w = Math.random() * 2 - 1;
    if (brown) { last = (last + 0.02 * w) / 1.02; ch[i] = last * 3.5; } else ch[i] = w;
  }
  return buf;
}
function noise(d, v, fFrom, fTo, at) {
  const a = audio(); if (!a) return;
  const t = a.currentTime + (at || 0);
  const src = a.createBufferSource(); src.buffer = noiseBuffer(a, d, false);
  const flt = a.createBiquadFilter(); flt.type = 'lowpass';
  flt.frequency.setValueAtTime(fFrom, t); flt.frequency.exponentialRampToValueAtTime(fTo, t + d);
  const g = a.createGain();
  g.gain.setValueAtTime(0.0001, t);
  g.gain.exponentialRampToValueAtTime(v * trim, t + Math.min(0.06, d / 4));
  g.gain.exponentialRampToValueAtTime(0.0001, t + d);
  src.connect(flt); flt.connect(g); g.connect(master); src.start(t); src.stop(t + d);
}
// Roket motoru: derin gürleme (kahverengi gürültü) + çatırtı (rastgele açılıp kapanan tiz gürültü) + bas titreşim
let eng = null;
function engineStart() {
  const a = audio(); if (!a || eng) return;
  const t = a.currentTime;
  const level = a.createGain(); level.gain.value = ENGINE_TRIM; level.connect(master);
  const out = a.createGain(); out.gain.setValueAtTime(0.0001, t); out.gain.exponentialRampToValueAtTime(1, t + 0.4); out.connect(level);
  const rumble = a.createBufferSource(); rumble.buffer = noiseBuffer(a, 3, true); rumble.loop = true;
  const lp = a.createBiquadFilter(); lp.type = 'lowpass'; lp.frequency.value = 520; lp.Q.value = 0.8;
  const rg = a.createGain(); rg.gain.value = 1.1; rumble.connect(lp); lp.connect(rg); rg.connect(out);
  const hiss = a.createBufferSource(); hiss.buffer = noiseBuffer(a, 2, false); hiss.loop = true;
  const bp = a.createBiquadFilter(); bp.type = 'bandpass'; bp.frequency.value = 2400; bp.Q.value = 0.7;
  const crackle = a.createGain(); crackle.gain.value = 0; hiss.connect(bp); bp.connect(crackle); crackle.connect(out);
  const sub = a.createOscillator(); sub.type = 'sine'; sub.frequency.value = 38;
  const sg = a.createGain(); sg.gain.value = 0.4; sub.connect(sg); sg.connect(out);
  rumble.start(t); hiss.start(t); sub.start(t);
  eng = { out, lp, crackle, srcs: [rumble, hiss, sub] };
}
function engineSet(level, cutoff) {      // her karede: uzaklaştıkça ses kısılır ve boğuklaşır
  if (!eng || !actx) return;
  const t = actx.currentTime;
  eng.out.gain.setTargetAtTime(Math.max(0.0001, level), t, 0.2);
  eng.lp.frequency.setTargetAtTime(cutoff, t, 0.3);
  eng.crackle.gain.setTargetAtTime(Math.pow(Math.random(), 3) * 0.55 * level, t, 0.006);
}
function engineStop(fade) {
  if (!eng || !actx) return;
  const n = eng, t = actx.currentTime; eng = null;
  n.out.gain.cancelScheduledValues(t); n.out.gain.setTargetAtTime(0.0001, t, Math.max(0.02, fade / 4));
  n.srcs.forEach((s) => { try { s.stop(t + fade + 0.3); } catch (e) {} });
}
function say(text) {                     // geri sayımı okuyan ses (tarayıcıda varsa)
  if (muted) return;
  try {
    const ss = window.parent.speechSynthesis, U = window.parent.SpeechSynthesisUtterance;
    if (!ss || !U) return;
    const u = new U(text); u.lang = 'en-US'; u.rate = 1.05; u.pitch = 0.8; u.volume = VOL * SPEECH_LEVEL;
    ss.cancel(); ss.speak(u);
  } catch (e) {}
}
function sayStop() { try { window.parent.speechSynthesis.cancel(); } catch (e) {} }
const RAW_SFX = {
  pip:     () => { tone(1180, 0.1, 'sine', 0.12); noise(0.14, 0.04, 5000, 2500); },
  siren:   () => [0, 1, 2, 3, 4, 5].forEach((i) => tone(i % 2 ? 620 : 830, 0.24, 'square', 0.07, null, i * 0.26)),
  ignite:  () => { noise(2.0, 0.95, 1400, 70); tone(95, 1.4, 'sine', 0.7, 30); },
  sep:     () => { noise(0.22, 0.55, 7000, 1200); tone(230, 0.14, 'square', 0.08, 90); },
  boom:    () => { noise(3.4, 1.0, 2600, 40); tone(70, 2.4, 'sine', 0.85, 18); noise(0.5, 0.6, 9000, 900); },
  whoosh:  () => noise(1.8, 0.22, 2600, 220),
  burn:    () => noise(1.1, 0.2, 900, 260),
  chime:   () => tone(1320, 0.14, 'sine', 0.08),
  glitch:  () => { for (let i = 0; i < 7; i++) tone(rand(180, 1400), 0.07, 'square', 0.06, null, i * 0.09); noise(0.7, 0.2, 4000, 3000); },
  win:     () => [523, 659, 784, 1047].forEach((f, i) => tone(f, 0.3, 'triangle', 0.2, null, i * 0.12)),
  collect: () => { tone(880, 0.08, 'square', 0.1); tone(1320, 0.14, 'square', 0.1, null, 0.07); },
  sent:    () => tone(1500, 0.07, 'sine', 0.07),
  energy:  () => tone(420, 0.3, 'triangle', 0.18, 900),
  hit:     () => { noise(0.45, 0.5, 900, 80); tone(170, 0.35, 'square', 0.18, 50); },
  full:    () => tone(200, 0.16, 'square', 0.09),
  over:    () => [784, 659, 523, 392].forEach((f, i) => tone(f, 0.32, 'triangle', 0.18, null, i * 0.16)),
};
// Her efekt kendi TRIM_DB düzeltmesiyle çalar
const SFX = {};
for (const name in RAW_SFX) SFX[name] = () => { trim = dbToGain(TRIM_DB[name] || 0); try { RAW_SFX[name](); } finally { trim = 1; } };
muteBtn.addEventListener('click', (e) => {
  e.stopPropagation(); muted = !muted; muteBtn.textContent = muted ? '🔇' : '🔊';
  if (master) master.gain.setTargetAtTime(muted ? 0 : VOL, actx.currentTime, 0.05);
  if (muted) sayStop(); else { audio(); SFX.collect(); }
  C.focus();
});

// ================================================================ ÇİZİM YARDIMCILARI
// PERFORMANS NOTLARI
// - Diziler "yerinde" temizlenir (compact): her karede filter() ile yeni dizi oluşturup çöp üretmez.
// - Ekrandan çıkan duman, asteroit, eşya ve parçacıklar diziden hemen silinir (bellek sızıntısı yok).
// - Gradyanlı arka plan, gezegenler, asteroitler, emojiler ve parlayan başlıklar bir kez küçük
//   canvas'lara (sprite) çizilir, her karede sadece kopyalanır (drawImage).
const C = document.getElementById('c');
let X = C.getContext('2d', { alpha: false });     // opak canvas (her karede tamamı boyanıyor); sprite çizerken geçici olarak değişir
let W = 640, H = 440, DPR = 1;
const PIXEL_BUDGET = 2400000;                     // çok büyük ekranda piksel sınırı (FPS için)
const MAX_WORLD = 600, MAX_PARTS = 400;
const spriteCache = new Map();
let bgCache = null;
function compact(arr, keep) {
  let n = 0;
  for (let i = 0; i < arr.length; i++) if (keep(arr[i])) arr[n++] = arr[i];
  arr.length = n;
}
function makeCanvas(w, h) {
  const c = document.createElement('canvas');
  c.width = Math.max(1, Math.ceil(w)); c.height = Math.max(1, Math.ceil(h));
  return c;
}
// key ile önbelleğe alınmış küçük çizim; w,h CSS pikseli
function sprite(key, w, h, draw) {
  let c = spriteCache.get(key);
  if (!c) {
    if (spriteCache.size > 80) spriteCache.clear();
    c = makeCanvas(w * DPR, h * DPR);
    const g = c.getContext('2d'); g.scale(DPR, DPR); draw(g, w, h);
    spriteCache.set(key, c);
  }
  return c;
}
function resize() {
  W = C.clientWidth || 640; H = C.clientHeight || 440;
  DPR = Math.min(window.devicePixelRatio || 1, 2);
  if (W * H * DPR * DPR > PIXEL_BUDGET) DPR = Math.max(1, Math.sqrt(PIXEL_BUDGET / (W * H)));
  C.width = Math.round(W * DPR); C.height = Math.round(H * DPR);
  X.setTransform(DPR, 0, 0, DPR, 0, 0);
  spriteCache.clear(); bgCache = null;
}
window.addEventListener('resize', resize); resize();

const FONT = 'Nunito, "Segoe UI Emoji", "Apple Color Emoji", system-ui, sans-serif';
const MONO = '"Share Tech Mono", ui-monospace, monospace';
function txt(s, x, y, size, color, align, family, weight) {
  X.font = `${weight || 800} ${size}px ${family || FONT}`;
  const room = W - 24, width = X.measureText(s).width;   // dar ekranda yazı sığsın diye küçült
  if (width > room && (align || 'center') === 'center') {
    X.font = `${weight || 800} ${Math.max(9, Math.floor(size * room / width))}px ${family || FONT}`;
  }
  X.textAlign = align || 'center'; X.textBaseline = 'middle';
  X.fillStyle = color || '#e8ecf4'; X.fillText(s, x, y);
}
// Parlayan başlık (shadowBlur çok pahalı): bir kez sprite'a çizilir
function title(s, x, y, size, color) {
  const fam = 'Orbitron, ' + FONT;
  X.font = `900 ${size}px ${fam}`;
  let fs = size;
  const room = W - 24, width = X.measureText(s).width;
  if (width > room) fs = Math.max(9, Math.floor(size * room / width));
  X.font = `900 ${fs}px ${fam}`;
  const w = Math.ceil(Math.min(width, room) + 64), h = Math.ceil(fs * 1.6 + 48);
  const c = sprite(`t|${s}|${fs}|${color}`, w, h, (g) => {
    g.font = `900 ${fs}px ${fam}`; g.textAlign = 'center'; g.textBaseline = 'middle';
    g.shadowColor = color || '#fc3d21'; g.shadowBlur = 24; g.fillStyle = '#ffffff'; g.fillText(s, w / 2, h / 2);
  });
  X.drawImage(c, x - w / 2, y - h / 2, w, h);
}
// Emoji (canvas'ta pahalı): bir kez sprite'a çizilir
function emoji(s, x, y, size) {
  const box = Math.ceil(size * 1.4);
  const c = sprite(`e|${s}|${size}`, box, box, (g) => {
    g.font = `${size}px ${FONT}`; g.textAlign = 'center'; g.textBaseline = 'middle'; g.fillText(s, box / 2, box / 2);
  });
  X.drawImage(c, x - box / 2, y - box / 2, box, box);
}
const big = () => Math.max(24, Math.min(60, W / 10));
function svgImage(spec) {
  if (!spec || !spec.svg) return null;
  const im = new Image();
  im.src = 'data:image/svg+xml;charset=utf-8,' + encodeURIComponent(spec.svg);
  return im;
}
const imgReady = (im) => im && im.complete && im.naturalWidth > 0;
const R = Object.assign({ width: 40, height: 210, base: 0.94, split: 0.45, plume: 12 }, CFG.rocket_img || {});
const CR = Object.assign({ width: 120, height: 130 }, CFG.craft_img || {});
const RIMG = svgImage(CFG.rocket_img), CIMG = svgImage(CFG.craft_img);
function roundRect(x, y, w, h, r) {
  X.beginPath();
  if (X.roundRect) X.roundRect(x, y, w, h, r); else X.rect(x, y, w, h);
}
// Tekrarlanabilir rastgele sayılar (gezegen desenleri her karede aynı kalsın)
function seeded(seed) { return () => { seed |= 0; seed = seed + 0x6D2B79F5 | 0; let t = Math.imul(seed ^ seed >>> 15, 1 | seed); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }
const stars = Array.from({ length: 170 }, () => ({ x: Math.random(), y: Math.random(), z: Math.random() * 0.8 + 0.2 }));
function starfield(alpha, scroll) {
  X.fillStyle = '#fff';
  for (const s of stars) {
    if (scroll) { s.x -= scroll * s.z * 0.00035; if (s.x < 0) { s.x += 1; s.y = Math.random(); } }
    X.globalAlpha = alpha * (0.3 + s.z * 0.7);
    X.fillRect(s.x * W, s.y * H, s.z * 1.7, s.z * 1.7);
  }
  X.globalAlpha = 1;
}
function space(scroll) {
  // 3 gradyanlı gökyüzü bir kez çizilir (boyut değişene kadar)
  if (!bgCache) {
    bgCache = makeCanvas(W * DPR, H * DPR);
    const b = bgCache.getContext('2d'); b.scale(DPR, DPR);
    const g = b.createLinearGradient(0, 0, 0, H);
    g.addColorStop(0, '#070d22'); g.addColorStop(0.6, '#03060f'); g.addColorStop(1, '#010309');
    b.fillStyle = g; b.fillRect(0, 0, W, H);
    const n = b.createRadialGradient(W * 0.62, H * 0.7, 0, W * 0.62, H * 0.7, W * 0.5);
    n.addColorStop(0, 'rgba(120,80,200,.10)'); n.addColorStop(1, 'rgba(120,80,200,0)');
    b.fillStyle = n; b.fillRect(0, 0, W, H);
    const sun = b.createRadialGradient(-W * 0.04, -H * 0.08, 0, -W * 0.04, -H * 0.08, W * 0.45);
    sun.addColorStop(0, 'rgba(255,230,170,.32)'); sun.addColorStop(1, 'rgba(255,200,120,0)');
    b.fillStyle = sun; b.fillRect(0, 0, W, H);
  }
  X.drawImage(bgCache, 0, 0, W, H);
  starfield(1, scroll);
}

// ---------------------------------------------------------------- Dünya ve hedef gezegen
const PLANETS = {
  Moon:   { c: ['#f4f4f4', '#a8a8a8', '#454545'], spots: '#6f6f6f', n: 8, craters: 10 },
  Venus:  { c: ['#fff5d2', '#e6be6c', '#8a5a22'], bands: '#fff3c9', haze: 'rgba(255,225,160,.40)' },
  Mars:   { c: ['#ffb58a', '#c9531c', '#5c1c06'], spots: '#7a2a10', n: 6, cap: true, haze: 'rgba(255,150,100,.20)' },
  Psyche: { c: ['#dcd2c3', '#8c7d6b', '#352d26'], spots: '#5d5246', n: 5, craters: 8, lumpy: true, small: true },
  Europa: { c: ['#ffffff', '#e4d8c4', '#8f7b62'], lines: '#a0703f' },
  Titan:  { c: ['#ffd88a', '#d9902e', '#6b3c0e'], bands: '#ffe3a8', haze: 'rgba(255,190,90,.50)' },
};
const PKEY = Object.keys(PLANETS).find((k) => CFG.target.includes(k)) || 'Moon';
const PL = PLANETS[PKEY];
const PFEAT = (() => {                  // gezegen yüzeyi desenleri (yarıçapa oranla)
  const r = seeded(PKEY.length * 977 + 13), f = { spots: [], craters: [], bands: [], lines: [], lump: [] };
  for (let i = 0; i < (PL.n || 0); i++) f.spots.push([r() * 1.4 - 0.7, r() * 1.4 - 0.7, 0.15 + r() * 0.3, 0.1 + r() * 0.2, r() * 3]);
  for (let i = 0; i < (PL.craters || 0); i++) f.craters.push([r() * 1.5 - 0.75, r() * 1.5 - 0.75, 0.04 + r() * 0.09]);
  if (PL.bands) for (let i = 0; i < 6; i++) f.bands.push([r() * 1.6 - 0.8, 0.05 + r() * 0.08]);
  if (PL.lines) for (let i = 0; i < 9; i++) f.lines.push([r() * 2 - 1, r() * 2 - 1, r() * 2 - 1, r() * 2 - 1]);
  for (let i = 0; i < 14; i++) f.lump.push(0.82 + r() * 0.22);
  return f;
})();
function planetPath(x, y, r) {
  X.beginPath();
  if (!PL.lumpy) { X.arc(x, y, r, 0, TAU); return; }
  const n = PFEAT.lump.length;
  for (let i = 0; i <= n; i++) {
    const a = (i / n) * TAU, k = PFEAT.lump[i % n], px = x + Math.cos(a) * r * k * 1.15, py = y + Math.sin(a) * r * k * 0.9;
    i ? X.lineTo(px, py) : X.moveTo(px, py);
  }
  X.closePath();
}
function drawPlanetRaw(x, y, r) {
  X.save();
  if (PL.haze) {
    const h = X.createRadialGradient(x, y, r * 0.92, x, y, r * 1.28);
    h.addColorStop(0, PL.haze); h.addColorStop(1, 'rgba(0,0,0,0)');
    X.fillStyle = h; X.beginPath(); X.arc(x, y, r * 1.28, 0, TAU); X.fill();
  }
  planetPath(x, y, r); X.clip();
  const g = X.createRadialGradient(x - r * 0.4, y - r * 0.45, r * 0.05, x, y, r * 1.15);
  g.addColorStop(0, PL.c[0]); g.addColorStop(0.55, PL.c[1]); g.addColorStop(1, PL.c[2]);
  X.fillStyle = g; X.fillRect(x - r * 1.4, y - r * 1.4, r * 2.8, r * 2.8);

let world = [];

function updateWorld(dt) {
  for (const p of world) {
    const damp = Math.exp(-(p.drag || 1.2) * dt);
    p.vx *= damp; p.vy = p.vy * damp + (p.g || 0) * dt;
    p.wx += p.vx * dt; p.wy += p.vy * dt; p.r += (p.grow || 0) * dt; p.life -= dt;
    if (p.rot !== undefined) p.rot += p.vr * dt;
    if (p.wy < 0 && p.type !== 'deb') { p.wy = 0; p.vy = Math.abs(p.vy) * 0.2; }
    if (p.wy < 0 && p.type === 'deb') p.life = 0;
  }
  compact(world, (p) => p.life > 0 && !p.gone);   // ömrü biten ya da ekranın altında kalan silinir
}
let parts = [];
function burst(x, y, n, colors, speed) {
  for (let i = 0; i < n; i++) {
    const a = Math.random() * TAU, v = (0.3 + Math.random()) * (speed || 220);
    parts.push({ x, y, vx: Math.cos(a) * v, vy: Math.sin(a) * v, life: 0.6 + Math.random() * 0.9,
                 c: colors[i % colors.length], r: 2 + Math.random() * 3 });
  }
  if (parts.length > MAX_PARTS) parts.splice(0, parts.length - MAX_PARTS);
}
function drawParts(dt) {
  for (const p of parts) { p.x += p.vx * dt; p.y += p.vy * dt; p.vx *= 0.98; p.vy *= 0.98; p.life -= dt; }
  compact(parts, (p) => p.life > 0 && p.x > -10 && p.x < W + 10 && p.y > -10 && p.y < H + 10);   // ömrü biten / ekrandan çıkan silinir
  for (const p of parts) { X.globalAlpha = Math.min(1, p.life); X.fillStyle = p.c; X.beginPath(); X.arc(p.x, p.y, p.r, 0, TAU); X.fill(); }
  X.globalAlpha = 1;
}

// ================================================================ GÖREV AKIŞI
// Aşamalar: pre (bütçe, yapım) → launch → cruise (yolculuk, uzay olayları) → orbit (varış ve sonrası)
function phaseOf(name) {
  if (name === 'Budget Approval' || name === 'Build and Test') return 'pre';
  if (name === 'Launch') return 'launch';
  if (name === 'Interplanetary Cruise' || name.startsWith('Space Event')) return 'cruise';
  return 'orbit';
}
const STAGES = CFG.stages.map((s) => Object.assign({}, s, { phase: phaseOf(s.name) }));
let FAIL = STAGES.find((s) => !s.ok) || null;
if (!CFG.success && !FAIL) FAIL = { name: 'Mission', msg: '', phase: 'orbit', ok: false };
const FAIL_PHASE = FAIL ? FAIL.phase : null;
const HEAVY = !!(FAIL && FAIL.name === 'Launch' && /heavy/i.test(FAIL.msg || ''));
const REASONS = {
  'Budget Approval': 'Too expensive! 💰 NASA said no.',
  'Build and Test': 'Not ready in time! 🗓️ The launch window closed.',
  'Interplanetary Cruise': 'Space radiation ☢️ broke the electronics.',
  'Arrival and Power-Up': 'Not enough power ⚡ to switch on.',
  'First Eclipse': 'The battery 🔋 ran flat in the dark.',
  'Signal to Earth': 'The antenna 📡 is too weak to call Earth.',
  'Pointing and Calibration': 'It wobbles 🌀 too much to aim.',
  'Science Operations': 'Not enough science 🔬 for your goals.',
  'Mapping the Target': 'The orbit 🪐 could not see enough.',
  'Data Downlink': 'Too much data 💾 for a slow antenna.',
  'Extended Operations': 'It wore out ⏳ too early.',
};
function kidReason(s) {
  if (!s) return 'Something went wrong.';
  if (REASONS[s.name]) return REASONS[s.name];
  if (s.name === 'Launch') return HEAVY ? 'Too heavy! 🏋️ The rocket could not lift it.' : 'Rocket failure! 🎲 Bad luck this time.';
  if (s.name.startsWith('Space Event')) return `${s.name.slice(13)} ☄️ broke the spacecraft.`;
  return String(s.msg || s.name).slice(0, 80);
}
const FIX_HINT = 'Fix it in the workshop and launch again 🔧';
const idxOfPhase = (ph) => STAGES.findIndex((s) => s.phase === ph);
const cruiseStages = STAGES.filter((s) => s.phase === 'cruise');
const orbitStages = STAGES.filter((s) => s.phase === 'orbit');
const firstAfterLaunch = STAGES.filter((s) => s.phase === 'pre' || s.phase === 'launch').length;

function revealReport() {
  if (revealed) return;

  try {
    const d = window.parent.document;
    d.querySelectorAll('[class*="st-key-report-delay-"]').forEach((el) => { el.style.animation = 'fadeUpNow .8s ease backwards'; });
    d.querySelectorAll('.report-wait').forEach((el) => { el.style.display = 'none'; });
  } catch (e) {}
}

function drawBanners(dt) {
  let y = mode === 'cruise' || mode === 'orbit' ? Math.max(H * 0.2, 22 + 4 * ((W < 420 ? 11 : 13) + 8) + 46) : H * 0.2;
  for (const b of banners) {

}
function drawOutcome(dt) {

  outcome.t += dt;
  const a = Math.min(1, outcome.t / 0.5), w = Math.min(W - 28, 470), lh = W < 420 ? 20 : 24;
  const h = 78 + outcome.lines.length * lh, x = (W - w) / 2, y = H * 0.5 - h / 2;

function setMode(m) {
  mode = m; mt = 0;
  if (m === 'ignite') { SFX.ignite(); engineStart(); say('Ignition!'); shake = 7; }
  if (m === 'ascent') { say('Liftoff!'); banner('LIFTOFF! 🚀', `${CFG.rocket} is flying`, '#ff8a3d', 2.2); }
  if (m === 'cruise') { engineStop(1.4); SFX.whoosh(); flash = 1; shown = firstAfterLaunch; parts = []; }
  if (m === 'orbit') { shown = firstAfterLaunch + cruiseStages.length; }

  if (m === 'play') newGame();

// ---------------------------------------------------------------- 1) RAMPA + ATEŞLEME + KALKIŞ
const PAD_T = 5, IGNITE_T = 1.5, ASCENT_T = 6.9;

let scrubAt = -1, boom = null, lower = null, lastCount = 99, camHold = null;
function ascentState(t) {
  const a0 = A0();
  const alt = a0 * (t * t / 2 + 0.05 * t * t * t);
  const vel = a0 * (t + 0.15 * t * t);
  const ang = Math.min(0.4, 0.03 * Math.pow(Math.max(0, t - 1.2), 1.5));
  return { alt, vel, ang, xoff: alt * Math.sin(ang) * 0.5 };

function padState() {

}

  return [mix([18, 34, 74], [1, 2, 8]), mix([62, 98, 152], [3, 6, 16]), mix([196, 120, 82], [3, 6, 16])];

    X.lineTo(W, H + 400); X.lineTo(0, H + 400); X.fill();

      X.fillStyle = bg; X.beginPath(); X.moveTo(bx, by); X.lineTo(SX(-R.width * k), SY(R.height * k * 0.75)); X.lineTo(SX(R.width * k * 0.6), gy); X.fill();

  }

  const tipX = SX(st.xoff), tipY = SY(st.alt);
  for (const p of world) {

    if (sy < -p.r || sy > H + p.r) continue;
    const d = Math.hypot(sx - tipX, sy - tipY), lit = engineOn * clamp(1 - d / (H * 0.32), 0, 1);
    const life = clamp(p.life / p.max, 0, 1), a = p.a * Math.min(1, (p.max - p.life) / 0.25 + 0.2) * Math.pow(life, 0.6);
    const c = p.c;
    X.fillStyle = `rgba(${Math.round(lerp(c, 255, lit))},${Math.round(lerp(c, 160, lit))},${Math.round(lerp(c, 90, lit))},${a})`;

  }

    const sep = mode === 'ascent' && mt >= SEP_T;
    const exitY = 7 * k, upperExit = (R.split - R.base) * R.height * k;
    if (engineOn > 0 && !sep) {

  for (const p of world) {
    if (p.type !== 'fire') continue;

    X.fillStyle = f < 0.15 ? 'rgba(255,250,220,.9)' : f < 0.45 ? 'rgba(255,180,70,.75)' : f < 0.75 ? 'rgba(255,90,30,.5)' : 'rgba(120,40,15,.35)';
    X.beginPath(); X.arc(SX(p.wx), SY(p.wy), p.r, 0, TAU); X.fill();
  }

  for (const p of world) {

  if (mode === 'ascent' && !boom) {
    const tp = Math.floor(realT), mm = String(Math.floor(tp / 60)).padStart(2, '0'), ss = String(tp % 60).padStart(2, '0');
    txt(`T+ 00:${mm}:${ss}`, W / 2, 46, Math.max(16, Math.min(26, W / 22)), '#ffffff', 'center', MONO, 400);
    const speed = Math.round(0.36 * realT * realT), fs = W < 420 ? 12 : 14, bx = 14, by = H - 92;
    roundRect(bx - 6, by - 16, W < 420 ? 150 : 180, 72, 10); X.fillStyle = 'rgba(3,6,13,.6)'; X.fill();
    txt(mt < SEP_T ? 'STAGE 1' : 'STAGE 2', bx, by, fs, '#4fd1ff', 'left', MONO, 400);
    txt(`SPEED ${speed.toLocaleString('en-US')} km/h`, bx, by + 20, fs, '#e8ecf4', 'left', MONO, 400);
    txt(`ALT   ${altKm.toFixed(1)} km`, bx, by + 40, fs, '#e8ecf4', 'left', MONO, 400);
  }
  if (mode === 'pad' || mode === 'ignite') {
    const n = mode === 'ignite' ? 0 : Math.max(0, Math.ceil(PAD_T - mt));
    const held = scrubAt >= 0;
    const label = held ? `T-${Math.max(1, Math.ceil(PAD_T - scrubAt))}  HOLD` : `T-${n}`;
    const blink = held && Math.floor(mt * 3) % 2 === 0;
    if (!blink) title(label, W / 2, H * 0.14, big() * (held ? 0.8 : 1.15), held ? '#ff4d5e' : '#fc3d21');
    if (mode === 'ignite') txt('🔥 IGNITION', W / 2, H * 0.14 + big() * 0.85, Math.max(14, W / 30), '#ffd98a');

}
function padTick(dt) {

  // Fırlatma öncesi sorun: T-3'te geri sayım durur

}
function igniteTick(dt) {

  }
  // Fırlatma hatası: roket patlar

    boom = { t: 0, wx, wy, ring: 0, at: mt };
    engineStop(0.15); SFX.boom(); sayStop(); flash = 0.95; shake = 16;
    for (let i = 0; i < 140; i++) {
      const a = Math.random() * TAU, v = rand(30, 380) * (H / 440);
      puff({ type: 'fire', wx: wx + rand(-8, 8), wy: wy + rand(-30, 30), vx: Math.cos(a) * v, vy: Math.sin(a) * v + st.vel * 0.15,
             r: rand(5, 18), grow: rand(14, 40), life: rand(0.6, 1.7), max: 1.7, drag: 2.2, g: -20 });
    }
    for (let i = 0; i < 70; i++) {
      const a = Math.random() * TAU, v = rand(20, 160);
      puff({ type: 'smoke', wx: wx + rand(-20, 20), wy: wy + rand(-30, 30), vx: Math.cos(a) * v, vy: Math.sin(a) * v,
             r: rand(10, 22), grow: rand(18, 34), life: rand(3, 5.5), max: 5.5, a: 0.5, c: Math.round(rand(55, 95)), drag: 1.2 });

             life: 6, max: 6, drag: 0.4, g: -H * 0.55 });

  if (on) {
    const tailX = st.xoff - Math.sin(st.ang) * R.height * k * 0.35, tailY = st.alt - Math.cos(st.ang) * R.height * k * 0.35;

    if (mt >= SEP_T && !lower) {

      SFX.sep(); banner('STAGE SEPARATION ✅', '', '#22d3a6', 1.6);
      for (let i = 0; i < 24; i++) puff({ type: 'smoke', wx: st.xoff + rand(-10, 10), wy: st.alt + R.height * k * (R.base - R.split) + rand(-6, 6),
                                          vx: rand(-90, 90), vy: rand(-90, 60), r: rand(3, 7), grow: rand(10, 20), life: rand(1, 2), max: 2, a: 0.5, c: 240, drag: 2 });
    }
    if (lower) { lower.vy -= H * 0.55 * dt; lower.wx += lower.vx * dt; lower.wy += lower.vy * dt; lower.ang += lower.va * dt; }
    if (once('ses', mt, SES_T)) banner('STAGE 2 IGNITION 🔥', '', '#ff8a3d', 1.2);
    // Uzaya çıkış: ekran beyaza döner, yolculuk sahnesi açılır

// ---------------------------------------------------------------- 2) YOLCULUK
const CRUISE_T = 6.2;
let crash = null, trail = [];
function cruiseGeo() {
  const m = Math.min(W, H);
  return { ex: W * 0.14, ey: H * 0.76, er: m * 0.16, px: W * 0.83, py: H * 0.3, pr: m * (PL.small ? 0.07 : 0.11) };
}
function routePoint(g, p) {
  const x0 = g.ex + g.er * 0.85, y0 = g.ey - g.er * 0.75, x2 = g.px - g.pr * 1.7, y2 = g.py + g.pr * 0.35;
  const cx = W * 0.4, cy = H * 0.04, u = 1 - p;
  return { x: u * u * x0 + 2 * u * p * cx + p * p * x2, y: u * u * y0 + 2 * u * p * cy + p * p * y2 };
}
const cruisePos = (j) => 0.22 + 0.62 * (j + 0.5) / Math.max(1, cruiseStages.length);
const cruiseStop = FAIL_PHASE === 'cruise' ? cruisePos(cruiseStages.indexOf(FAIL)) : 1;
function drawChecklist() {
  const fs = W < 420 ? 11 : 13, lh = fs + 8, first = Math.max(0, shown - 4);
  for (let i = first; i < shown && i < STAGES.length; i++) {
    const s = STAGES[i], y = 22 + (i - first) * lh;
    txt(`${s.ok ? '✅' : '❌'} ${s.name}`, 14, y, fs, s.ok ? '#bff5e6' : '#ffb3ba', 'left');
  }
}
function drawCruise(dt) {
  space(30);
  const g = cruiseGeo();
  drawEarth(g.ex, g.ey, g.er);
  drawPlanet(g.px, g.py, g.pr);
  txt(CFG.target, g.px, g.py + g.pr * 1.45 + 10, W < 420 ? 12 : 14, '#d3dae8');
  const raw = clamp(mt / CRUISE_T, 0, 1), pr = Math.min(ease(raw), cruiseStop);
  // Yol: kesik çizgi (planlanan) + parlayan çizgi (gidilen)
  X.setLineDash([4, 8]); X.strokeStyle = 'rgba(159,220,255,.35)'; X.lineWidth = 1.5; X.beginPath();
  for (let i = 0; i <= 60; i++) { const p = routePoint(g, i / 60); i ? X.lineTo(p.x, p.y) : X.moveTo(p.x, p.y); }
  X.stroke(); X.setLineDash([]);
  // Parlama: shadowBlur yerine önce kalın yarı saydam, sonra ince parlak çizgi (aynı yol)
  X.beginPath();
  for (let i = 0; i <= 60 * pr; i++) { const p = routePoint(g, i / 60); i ? X.lineTo(p.x, p.y) : X.moveTo(p.x, p.y); }
  X.lineCap = 'round'; X.strokeStyle = 'rgba(79,209,255,.22)'; X.lineWidth = 9; X.stroke();
  X.strokeStyle = 'rgba(79,209,255,.85)'; X.lineWidth = 2.5; X.stroke(); X.lineCap = 'butt';
  // Aşamalar ve uzay olayları yol üzerinde sırayla
  cruiseStages.forEach((s, j) => {
    const idx = firstAfterLaunch + j;
    if (pr >= cruisePos(j) - 1e-6 && shown <= idx && s.ok) {
      shown = idx + 1;
      if (s.name.startsWith('Space Event')) {
        const p = routePoint(g, pr);
        banner(`☄️ ${s.name.slice(13)}`, 'Your spacecraft survived ✅', '#ffd98a', 2);
        burst(p.x, p.y, 26, ['#ffe066', '#ffb347', '#ffffff'], 140); SFX.chime();
        trail.push({ ring: 0, x: p.x, y: p.y });
      } else SFX.chime();
    }
  });
  const p = routePoint(g, pr), size = clamp(Math.min(W, H) * 0.15, 46, 92);
  // Motor yanması: başta hedefe yönelme, sonda frenleme
  const burning = !crash && (pr < 0.1 || (raw > 0.9 && cruiseStop === 1));
  if (burning) {
    X.save(); X.globalCompositeOperation = 'lighter';
    const rg = X.createRadialGradient(p.x, p.y + size * 0.45, 0, p.x, p.y + size * 0.45, size * 0.5);
    rg.addColorStop(0, 'rgba(180,210,255,.9)'); rg.addColorStop(1, 'rgba(120,160,255,0)');
    X.fillStyle = rg; X.fillRect(p.x - size, p.y - size * 0.1, size * 2, size * 1.2); X.restore();
  }
  for (const r of trail) {
    r.ring += dt * 1.4;
    if (r.ring < 1) { X.strokeStyle = `rgba(79,209,255,${1 - r.ring})`; X.lineWidth = 3; X.beginPath(); X.arc(r.x, r.y, size * (0.5 + r.ring), 0, TAU); X.stroke(); }
  }
  compact(trail, (r) => r.ring < 1);   // biten halkalar silinir (eskiden dizide kalıyordu)
  // Yolculukta hata: kıvılcım, takla, sinyal kaybı

  }

    if (Math.random() < 0.25) burst(p.x, p.y, 3, ['#ff8a3d', '#ffffff'], 90);
    X.globalAlpha = 0.08 + Math.random() * 0.08; X.fillStyle = '#fff';           // parazit

    X.globalAlpha = 1;
    if (crash.t > 1.4) failCard('📡 SIGNAL LOST');

    craftImg(p.x, p.y + Math.sin(mt * 2) * 2, size, Math.sin(mt * 0.8) * 0.05, false);
  }

  drawChecklist();
  if (mt < 1.6) txt(`🛰️ ${CFG.name}'s spacecraft is on its way!`, W / 2, H - 26, W < 420 ? 13 : 15, '#d6fff2');
  if (!crash && raw >= 1) setMode('orbit');
}

// ---------------------------------------------------------------- 3) YÖRÜNGEYE GİRİŞ VE VARIŞ
const ORBIT_START = 1.3, ORBIT_STEP = 0.3;
let orbitFail = null, arrivedAt = -1, theta = Math.PI * 0.75;
function drawOrbit(dt) {
  space(8);
  const g = cruiseGeo(), m = Math.min(W, H), z = ease(clamp(mt / 1.1, 0, 1));
  const cx = lerp(g.px, W * 0.6, z), cy = lerp(g.py, H * 0.54, z), r = lerp(g.pr, m * (PL.small ? 0.19 : 0.26), z);
  if (z < 1) drawEarth(g.ex - z * W * 0.5, g.ey + z * H * 0.2, g.er * (1 - z * 0.6));
  const rx = r * 1.55, ry = r * 0.42, tilt = -0.22;
  const speed = orbitFail ? Math.max(0.15, 1.5 - orbitFail.t) : 1.5;
  if (mt > 1.1) theta += speed * dt;
  const ex = Math.cos(theta) * rx, ey = Math.sin(theta) * ry;
  let ox = cx + ex * Math.cos(tilt) - ey * Math.sin(tilt), oy = cy + ex * Math.sin(tilt) + ey * Math.cos(tilt);
  if (z < 1) { const e = routePoint(g, 1); ox = lerp(e.x, ox, z); oy = lerp(e.y, oy, z); }
  const behind = mt > 1.1 && Math.sin(theta) < 0, size = clamp(m * 0.1, 30, 58);
  X.save(); X.translate(cx, cy); X.rotate(tilt);
  X.setLineDash([3, 7]); X.strokeStyle = 'rgba(159,220,255,.35)'; X.lineWidth = 1.5;
  X.beginPath(); X.ellipse(0, 0, rx * z, ry * z, 0, 0, TAU); X.stroke(); X.setLineDash([]); X.restore();
  const drawCraft = () => {
    const dark = !!orbitFail;
    if (!orbitFail || Math.floor(orbitFail.t * 10) % 3) craftImg(ox, oy, size, orbitFail ? orbitFail.t * 1.2 : 0, dark);
    X.fillStyle = dark ? '#ff4d5e' : (Math.floor(mt * 3) % 2 ? '#22d3a6' : '#0b3d30');
    X.beginPath(); X.arc(ox + size * 0.3, oy - size * 0.3, 2.5, 0, TAU); X.fill();
  };
  if (behind) drawCraft();
  drawPlanet(cx, cy, r);
  if (!behind) drawCraft();
  if (once('moi', mt, 0.55)) { banner('ORBIT INSERTION 🔥', 'Braking to stay around ' + CFG.target, '#ff8a3d', 1.6); SFX.burn(); }
  // Varıştan sonraki aşamalar sırayla
  orbitStages.forEach((s, j) => {
    const idx = firstAfterLaunch + cruiseStages.length + j;
    if (!orbitFail && mt >= ORBIT_START + j * ORBIT_STEP && shown <= idx) {
      shown = idx + 1;
      if (s.ok) SFX.chime();
      else { orbitFail = { t: 0 }; SFX.glitch(); shake = 5; burst(ox, oy, 30, ['#ff4d5e', '#ffb347', '#fff'], 150); }
    }
  });
  const allDone = mt >= ORBIT_START + orbitStages.length * ORBIT_STEP;
  if (!orbitFail && FAIL_PHASE === 'orbit' && allDone) { orbitFail = { t: 0 }; SFX.glitch(); }   // yedek: hata listede yoksa
  if (orbitFail) { orbitFail.t += dt; if (orbitFail.t > 1.4) failCard('💥 MISSION LOST'); }
  if (!orbitFail && FAIL_PHASE !== 'orbit' && allDone && arrivedAt < 0) {
    arrivedAt = mt; SFX.win(); banner('ARRIVED! 🎉', `Welcome to ${CFG.target}, ${CFG.name}!`, '#22d3a6', 2.4);
    for (let i = 0; i < 3; i++) burst(rand(W * 0.2, W * 0.8), rand(H * 0.2, H * 0.6), 30, ['#4fe3b5', '#4fd1ff', '#ffe066', '#fff'], 200);
  }
  drawParts(dt);
  drawChecklist();
  if (arrivedAt >= 0 && mt - arrivedAt > 2.6) setMode('ready');
}

function spawnRock(ramp) {
  const r = 13 + Math.random() * 22, n = 9, pts = [];
  for (let i = 0; i < n; i++) pts.push(0.7 + Math.random() * 0.35);
  S.rocks.push({ x: W + r, y: 60 + Math.random() * (H - 80), r, img: rockSprite(r, pts), rot: 0, vr: (Math.random() - 0.5) * 3,
                 vx: -(140 + Math.random() * 130) * Math.sqrt(ramp), vy: (Math.random() - 0.5) * 40 });
}
// Asteroit resmi doğduğu anda bir kez çizilir; her karede sadece döndürülüp kopyalanır
function rockSprite(r, pts) {
  const R = r * 1.1 + 2, c = makeCanvas(R * 2 * DPR, R * 2 * DPR), g = c.getContext('2d');
  g.scale(DPR, DPR); g.translate(R, R); g.beginPath();
  pts.forEach((k, i) => { const a = i / pts.length * TAU; const px = Math.cos(a) * r * k, py = Math.sin(a) * r * k; i ? g.lineTo(px, py) : g.moveTo(px, py); });
  g.closePath();
  const rg = g.createRadialGradient(-r * 0.3, -r * 0.3, 1, 0, 0, r);
  rg.addColorStop(0, '#9a9fae'); rg.addColorStop(1, '#45484f');
  g.fillStyle = rg; g.fill(); g.strokeStyle = '#a3a8b8'; g.lineWidth = 1.5; g.stroke();
  g.fillStyle = 'rgba(40,42,48,.7)'; g.beginPath(); g.arc(r * 0.2, -r * 0.15, r * 0.22, 0, TAU); g.fill();
  c.R = R;
  return c;
}
function spawnItem(kind) {
  S.items.push({ kind, x: W + 20, y: 64 + Math.random() * (H - 96), vx: -(120 + Math.random() * 70), bob: Math.random() * 6 });
}
function endGame(reason) {
  S.reason = reason;
  if (S.score > best) { best = S.score; S.newBest = true; try { localStorage.setItem('smg_best_flight', String(best)); } catch (e) {} }
  S.score >= 1 && reason.startsWith('🏁') ? SFX.win() : SFX.over();
  setMode('end');
}
function update(dt) {
  S.t += dt;
  let ax = 0, ay = 0;
  if (keys.left) ax -= 1; if (keys.right) ax += 1; if (keys.up) ay -= 1; if (keys.down) ay += 1;
  if (pointer.on) { const dx = pointer.x - S.x, dy = pointer.y - S.y, d = Math.hypot(dx, dy); if (d > 14) { ax = dx / d; ay = dy / d; } }
  const n = Math.hypot(ax, ay); if (n > 0) { ax /= n; ay /= n; }
  S.thrust = n > 0 && S.energy > 0;
  // Ağır araç = az ivme + az sürtünme → hantal (G.agility, Python'dan)
  const accel = 1150 * G.agility, drag = 1.1 + 2.1 * G.agility;
  if (S.thrust) { S.vx += ax * accel * dt; S.vy += ay * accel * dt; }
  S.vx -= S.vx * drag * dt; S.vy -= S.vy * drag * dt;
  S.x += S.vx * dt; S.y += S.vy * dt;
  if (S.x < 22) { S.x = 22; S.vx = 0; } if (S.x > W - 22) { S.x = W - 22; S.vx = 0; }
  if (S.y < 62) { S.y = 62; S.vy = 0; } if (S.y > H - 22) { S.y = H - 22; S.vy = 0; }
  // Güç payı az → enerji hızlı biter (G.energy_drain, saniyede yüzde)
  S.energy -= G.energy_drain * dt * (S.thrust ? 1.6 : 1.0);
  if (S.energy <= 0) { S.energy = 0; return endGame('🔌 Out of power!'); }
  const ramp = 1 + S.t / 45;
  S.spawnR -= dt; if (S.spawnR <= 0) { S.spawnR = (0.6 + Math.random() * 0.8) / (0.8 * G.asteroid_rate * ramp); spawnRock(ramp); }
  S.spawnD -= dt; if (S.spawnD <= 0) { S.spawnD = 0.8 + Math.random() * 0.7; spawnItem('data'); }
  S.spawnE -= dt; if (S.spawnE <= 0) { S.spawnE = 4.5 + Math.random() * 2.5; spawnItem('energy'); }
  S.inv = Math.max(0, S.inv - dt);
  for (const r of S.rocks) {
    r.x += r.vx * dt; r.y += r.vy * dt; r.rot += r.vr * dt;
    if (!r.dead && S.inv <= 0 && Math.hypot(r.x - S.x, r.y - S.y) < r.r + 11) {
      r.dead = true; S.lives -= 1; S.inv = 1.6; shake = 5; SFX.hit();
      burst(S.x, S.y, 26, ['#ffb347', '#9aa7bf', '#fc3d21'], 200);
      floatText('-1 ❤️', S.x, S.y - 26, '#ffb3ba');
      if (S.lives <= 0) return endGame('💥 Your spacecraft broke!');
    }
  }
  compact(S.rocks, (r) => !r.dead && r.x > -r.r - 20 && r.y > -r.r - 40 && r.y < H + r.r + 40);   // ekrandan çıkan / çarpan silinir
  for (const it of S.items) {
    it.x += it.vx * dt; it.bob += dt * 4;
    if (!it.got && Math.hypot(it.x - S.x, it.y - S.y) < 26) {
      it.got = true;
      if (it.kind === 'energy') { S.energy = Math.min(100, S.energy + 30); SFX.energy(); floatText('+⚡', it.x, it.y, '#ffe066'); }
      else if (S.tank < G.data_storage) { S.tank += 1; SFX.collect(); floatText('💾', it.x, it.y, '#9fdcff'); }
      else { SFX.full(); floatText('MEMORY FULL!', it.x, it.y, '#ffb3ba'); }
    }
  }
  compact(S.items, (it) => !it.got && it.x > -40);
  // Anten veriyi Dünya'ya yollar (G.downlink_rate paket / saniye)
  if (S.tank > 0) {
    S.acc += G.downlink_rate * dt;
    while (S.acc >= 1 && S.tank > 0) {
      S.acc -= 1; S.tank -= 1; S.sent += 1; S.score += G.packet_points; S.beam = 0.3; SFX.sent();
      floatText('+' + G.packet_points + ' 🔬', 40, H - 52, '#bff5e6');
    }
  } else { S.acc = Math.min(1, S.acc + G.downlink_rate * dt); }
  S.beam = Math.max(0, S.beam - dt);
  if (S.t >= G.seconds) {
    if (S.tank > 0) { S.score += S.tank * G.packet_points; S.sent += S.tank; S.tank = 0; }
    return endGame('🏁 Mission complete!');
  }
}
function bar(x, y, w, h, frac, c) {
  X.fillStyle = 'rgba(255,255,255,.12)'; X.fillRect(x, y, w, h);
  X.fillStyle = c; X.fillRect(x, y, w * Math.max(0, Math.min(1, frac)), h);
}
function ship(x, y, tilt, thrust, blink) {    // oyundaki uzay aracı: atölyede tasarlanan araç
  if (blink) return;
  const size = clamp(W * 0.1, 48, 72);
  if (thrust) {
    X.save(); X.translate(x, y); X.rotate(tilt); X.globalCompositeOperation = 'lighter';
    const L = 16 + Math.random() * 14, g = X.createLinearGradient(-size * 0.2, 0, -size * 0.2 - L, 0);
    g.addColorStop(0, 'rgba(200,220,255,.95)'); g.addColorStop(1, 'rgba(90,130,255,0)');
    X.fillStyle = g; X.beginPath(); X.moveTo(-size * 0.18, -5); X.lineTo(-size * 0.2 - L, 0); X.lineTo(-size * 0.18, 5); X.fill();
    X.restore();
  }
  craftImg(x, y, size, tilt, false);
}
function drawGame(dt) {
  space(260);
  drawPlanet(W - 40, H - 30, Math.min(W, H) * 0.2);
  emoji('🌍', 28, H - 26, 30);
  if (S.beam > 0) {
    X.strokeStyle = `rgba(79,209,255,${S.beam * 3})`; X.lineWidth = 2; X.setLineDash([4, 6]);
    X.beginPath(); X.moveTo(S.x, S.y); X.lineTo(28, H - 26); X.stroke(); X.setLineDash([]);
  }
  for (const it of S.items) emoji(it.kind === 'energy' ? '⚡' : '💾', it.x, it.y + Math.sin(it.bob) * 4, 24);
  for (const r of S.rocks) {
    if (r.x - r.r > W) continue;   // henüz ekrana girmedi
    X.save(); X.translate(r.x, r.y); X.rotate(r.rot);
    X.drawImage(r.img, -r.img.R, -r.img.R, r.img.R * 2, r.img.R * 2);
    X.restore();
  }
  const tilt = Math.max(-0.5, Math.min(0.5, S.vy / 500));
  ship(S.x, S.y, tilt, S.thrust, S.inv > 0 && Math.floor(S.inv * 10) % 2 === 0);
  drawParts(dt);
  for (const f of S.floats) { f.y -= 30 * dt; f.life -= dt; X.globalAlpha = Math.max(0, f.life); txt(f.s, f.x, f.y, 15, f.c); }
  X.globalAlpha = 1; compact(S.floats, (f) => f.life > 0);
  // Üst gösterge
  X.fillStyle = 'rgba(3,6,13,.82)'; X.fillRect(0, 0, W, 46);
  const small = W < 460, fs = small ? 13 : 15, bw = small ? 46 : 80;
  let x = 10;
  txt('❤️'.repeat(Math.max(0, S.lives)) || '💔', x, 23, small ? 12 : 15, '#fff', 'left'); x += (small ? 15 : 19) * Math.max(1, G.lives) + 8;
  txt('⚡', x, 23, fs, '#fff', 'left'); bar(x + 20, 18, bw, 10, S.energy / 100, S.energy > 30 ? '#ffe066' : '#ff4d5e'); x += bw + 30;
  txt('💾', x, 23, fs, '#fff', 'left');
  for (let i = 0; i < G.data_storage; i++) {
    X.fillStyle = i < S.tank ? (S.tank >= G.data_storage ? '#ff8a3d' : '#4fd1ff') : 'rgba(255,255,255,.14)';
    X.fillRect(x + 22 + i * (small ? 7 : 10), 17, small ? 5 : 8, 12);
  }
  txt(`⏱️ ${Math.max(0, Math.ceil(G.seconds - S.t))}`, W - 10, 23, fs, '#fff', 'right');
  txt(`🔬 ${S.score}`, W - (small ? 62 : 80), 23, fs, '#bff5e6', 'right');
}
function drawReady() {
  space(60);
  drawPlanet(W * 0.86, H * 0.8, Math.min(W, H) * 0.22);
  craftImg(W * 0.5, H * 0.62 + Math.sin(mt * 2) * 4, clamp(Math.min(W, H) * 0.2, 60, 110), 0, false);
  title(`🎮 FLY IT, ${CFG.name.toUpperCase()}!`, W / 2, H * 0.13, Math.max(18, Math.min(38, W / 16)), '#4fd1ff');
  const fs = W < 420 ? 13 : 16, lh = fs + 11;
  const lines = [
    '⬅️ ⬆️ ➡️ ⬇️  or  W A S D  to fly  (or touch and drag)',
    '💾 Grab data: your antenna sends it home as 🔬 points',
    `⚡ Grab energy · ☄️ Dodge the asteroids · ⏱️ ${G.seconds} s`,
  ];
  lines.forEach((l, i) => txt(l, W / 2, H * 0.27 + i * lh, fs, '#d3dae8'));
  if (Math.floor(mt * 2) % 2 === 0) title('CLICK / TAP OR PRESS SPACE TO START', W / 2, H * 0.9, Math.max(12, Math.min(20, W / 30)));
}
function drawEnd() {
  space(40);
  txt(S.reason, W / 2, H * 0.17, Math.max(16, Math.min(26, W / 20)), '#ffd98a');
  title(CFG.name, W / 2, H * 0.32, Math.max(20, Math.min(46, W / 13)), '#4fd1ff');
  txt('🔬 SCIENCE SENT HOME', W / 2, H * 0.46, W < 420 ? 13 : 16, '#9fdcff');
  title(String(S.score), W / 2, H * 0.58, big() * 1.15, '#22d3a6');
  txt(S.newBest ? '🏆 NEW BEST!' : `🏆 Your best: ${best}`, W / 2, H * 0.7, 16, '#ffd98a');
  txt(`💾 ${S.sent} data packets · ⏱️ ${Math.min(G.seconds, Math.round(S.t))} s`, W / 2, H * 0.78, 14, '#c6cfdf');
  if (mt > 1 && Math.floor(mt * 2) % 2 === 0) title('CLICK / TAP OR SPACE TO FLY AGAIN', W / 2, H * 0.9, Math.max(11, Math.min(18, W / 34)));
}

// ================================================================ GİRDİ
const KEYMAP = { ArrowLeft: 'left', a: 'left', A: 'left', ArrowRight: 'right', d: 'right', D: 'right',
                 ArrowUp: 'up', w: 'up', W: 'up', ArrowDown: 'down', s: 'down', S: 'down' };
function startIfReady() {
  audio();
  if (mode === 'ready' || (mode === 'end' && mt > 1)) setMode('play');
}
window.addEventListener('keydown', (e) => {
  if (KEYMAP[e.key]) { keys[KEYMAP[e.key]] = true; e.preventDefault(); }
  if (e.key === ' ' || e.key === 'Enter') { e.preventDefault(); startIfReady(); }
});
window.addEventListener('keyup', (e) => { if (KEYMAP[e.key]) keys[KEYMAP[e.key]] = false; });
window.addEventListener('blur', () => { for (const k in keys) keys[k] = false; pointer.on = false; });
function pos(e) { const r = C.getBoundingClientRect(); return { x: e.clientX - r.left, y: e.clientY - r.top }; }
C.addEventListener('pointerdown', (e) => {
  C.focus(); audio();
  if (mode === 'play') { const p = pos(e); pointer.on = true; pointer.x = p.x; pointer.y = p.y; C.setPointerCapture(e.pointerId); }
  else startIfReady();
});
C.addEventListener('pointermove', (e) => { if (pointer.on) { const p = pos(e); pointer.x = p.x; pointer.y = p.y; } });
C.addEventListener('pointerup', () => { pointer.on = false; });
C.addEventListener('pointercancel', () => { pointer.on = false; });
skipBtn.addEventListener('click', (e) => {
  e.stopPropagation(); sayStop(); engineStop(0.2); banners = [];
  if (outcome) return;
  setMode(CFG.success ? 'ready' : 'lost');
});

// ================================================================ ANA DÖNGÜ
let last = performance.now(), running = true, visible = true;
// iframe ekranda görünmüyorsa (oyuncu rapora kaydırdıysa) bekleme ekranları ve oyun durur:
// boşuna saniyede 60 kare çizilmez. Görününce kaldığı yerden devam eder.
const IDLE_MODES = new Set(['ready', 'end', 'lost', 'play']);
try {
  new IntersectionObserver((entries) => {
    visible = entries[entries.length - 1].isIntersecting;
    if (visible && !running) { running = true; last = performance.now(); requestAnimationFrame(frame); }
  }).observe(C);
} catch (e) { visible = true; }
function frame(now) {
  if (!visible && IDLE_MODES.has(mode)) { running = false; return; }
  // Animasyon gerçek zamanla ilerler (yavaş cihazda da aynı sürede biter);
  // oyun fiziği ise kare başına en fazla 0.05 sn ilerler (takılmada araç duvardan geçmesin).
  const raw = Math.max(0, (now - last) / 1000); last = now;
  const dt = Math.min(0.05, raw); mt += Math.min(raw, 2);
  X.save();
  shake = Math.max(shakeFloor, shake - dt * 10);
  if (shake > 0.2) X.translate((Math.random() - 0.5) * shake, (Math.random() - 0.5) * shake);
  if (mode === 'pad' || mode === 'ignite' || mode === 'ascent') {
    if (mode === 'pad') padTick(dt); else if (mode === 'ignite') igniteTick(dt); else ascentTick(dt);
    updateWorld(dt);
    if (mode === 'pad' || mode === 'ignite' || mode === 'ascent') drawPadScene(dt);
    else if (mode === 'cruise') drawCruise(0);
  }
  else if (mode === 'cruise') drawCruise(dt);
  else if (mode === 'orbit') drawOrbit(dt);
  else if (mode === 'ready') drawReady();
  else if (mode === 'play') { update(dt); if (mode === 'play') drawGame(dt); }
  else if (mode === 'end') drawEnd();
  else if (mode === 'lost') drawLost();
  X.restore();
  if (mode !== 'play') drawBanners(dt);
  drawOutcome(dt);
  if (mode !== 'ascent') flash = Math.max(0, flash - dt * 1.3);
  if (flash > 0) { X.fillStyle = `rgba(236,244,255,${flash})`; X.fillRect(0, 0, W, H); }
  requestAnimationFrame(frame);
}
if (CFG.animate) setMode('pad');
else { setMode(CFG.success ? 'ready' : 'lost'); revealReport(); }
requestAnimationFrame(frame);
// LAUNCH'a basılınca animasyon ekranı görünür yerde olsun (telefonda sayfa aşağıda kalmasın)
try { window.frameElement.scrollIntoView({ behavior: 'smooth', block: 'nearest' }); } catch (e) {}
</script>
